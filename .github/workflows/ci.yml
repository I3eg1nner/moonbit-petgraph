name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Acceptance gates: check, fmt, info, test — all with warnings as errors.
  verify:
    name: Verify (check / fmt / info / test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Report toolchain version
        run: moon version --all

      # 1) Type check, all backends, warnings are errors.
      - name: moon check --deny-warn
        run: moon check --target all --deny-warn

      # 2) Formatting must be canonical (source + moon.mod / moon.pkg).
      - name: moon fmt && git diff --exit-code
        run: |
          moon fmt
          git diff --exit-code

      # 3) Public interface files (.mbti) must be committed and up to date.
      - name: moon info && git diff --exit-code
        run: |
          moon info
          git diff --exit-code

      # 4) Full test suite, warnings are errors. Covers the doc-tested
      #    examples in src/README.mbt.md as well as the unit tests.
      - name: moon test --deny-warn
        run: moon test --deny-warn

  # Build + test on every backend.
  build-test:
    name: Build & Test (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [wasm, wasm-gc, js, native]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Build
        run: moon build --target ${{ matrix.backend }}

      - name: Test
        run: moon test --target ${{ matrix.backend }}

  # The entry point the README tells users to run must actually run.
  demo:
    name: Run demo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: moon run src/cmd/main
        run: moon run src/cmd/main

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Run tests with coverage
        run: moon test --enable-coverage

      - name: Generate coverage report
        run: moon coverage report -f summary
